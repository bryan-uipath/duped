[package]
name = "duped"
version = "0.1.0"
edition = "2024"
description = "Find duplicated functions and types across TypeScript, JavaScript, Python, C# and Rust"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
globset = "0.4.20"
ignore = "0.4.33"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tree-sitter = "0.27.0"
tree-sitter-c-sharp = "0.23"
tree-sitter-typescript = "0.23.2"

[profile.release]
lto = true
